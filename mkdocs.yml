site_name: TMD - Timebase Markdown/Textual Music Description
site_description: 讓心中的旋律，透過簡單的文字，成為第一個可以試聽 MIDI 以及樂譜的工作流。
site_author: TMD Contributors
site_url: https://tmdlang.github.io/
copyright: Released under the MIT License. In memory of Chen, Chih-Han / aguai (阿怪, 1974–2019)
# repo_url: https://github.com/tmdlang/

theme:
  name: material
  language: zh-Hant
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換為深色模式
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換為淺色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - 關於 TMD: index.md
  - "在瀏覽器中撰寫 TMD":
    - TMD Studio: tmd_studio.md
    - Web MCP 設定: web_mcp.md
  - "在本機環境撰寫 TMD":
    - VS Code 套件: vscode.md
    - CLI 工具: cli.md
  - "用 TMD 創作":
    - AI 協同寫歌: ai_agent.md
    - 動機與變奏: motif_variation.md
    - 創作大型作品: epic_composing.md
    - 後期製作: production_workflow.md
    - 演算法生成音樂: algorithmic_music.md
    - 更多奇思妙想: creative_experiments.md
  - "範例":
    - "遊戲音樂—勇者之旅": example_journey.md
    - "為失傳的歌曲重新譜曲": example_new_first_army.md
    - "二部合唱": example_choir.md
    - "專案主題曲 — Legacy": example_legacy.md
  - 歌曲分析器: inspector.md
  - 語法規格: syntax.md
  - 常見問答: faq.md
  - 開發者指南: developer.md
  - GitHub: https://github.com/tmdlang/