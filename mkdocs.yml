site_name: TMD - Timebase Markdown/Textual Music Description
site_description: 讓心中的旋律，透過簡單的文字，成為第一個可以試聽 MIDI 以及樂譜的工作流。
site_author: TMD Contributors

theme:
  name: material
  language: zh-Hant
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換為深色模式
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換為淺色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - 關於 TMD: index.md
  - TMD Studio: tmd_studio.md
  - VS Code 套件: vscode.md
  - CLI 工具: cli.md
  - 歌曲分析: inspector.md
  - AI 協同寫歌: ai_agent.md
  - 動機與變奏: motif_variation.md
  - 創作大型作品: epic_composing.md
  - 後期製作: production_workflow.md
  - 演算法生成: algorithmic_music.md
  - 奇思妙想: creative_experiments.md
  - 語法規格: syntax.md
  - 常見問答: faq.md
